<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Forms & Applications | 111ATL</title>
  <meta name="description" content="Submit an RSVP, reservation, application, partnership request, NDA, or other public 111ATL form.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/form.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to form</a>
  <header>
    <a class="brand" href="/"><span>111</span><b>ATL</b></a>
    <a class="back" href="/">← Back to 111ATL</a>
  </header>
  <main id="main">
    <section class="intro">
      <p class="kicker">Direct access</p>
      <h1 id="pageTitle">Forms & applications</h1>
      <p id="pageDescription">Choose the correct lane and your submission will route to the connected 111ATL operations system.</p>
    </section>
    <p class="status" id="loadingStatus" role="status">Loading current forms…</p>
    <section class="directory" id="formDirectory" hidden aria-label="Available forms"></section>
    <section class="form-shell" id="formShell" hidden>
      <form id="publicForm" novalidate>
        <div class="fields" id="formFields"></div>
        <div class="consent" id="standardConsent">
          <label><input type="checkbox" name="email_consent" value="true"> You may email me about this request.</label>
          <label><input type="checkbox" name="sms_consent" value="true"> You may text me about this request. Message and data rates may apply.</label>
        </div>
        <input class="honeypot" type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="submit" type="submit">Submit request</button>
        <p class="response" id="formResponse" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer>© 2026 The Kollective ENT. · Atlanta, Georgia</footer>
  <script src="/form.js" defer></script>
</body>
</html>
